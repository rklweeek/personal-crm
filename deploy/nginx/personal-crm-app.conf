# app.stayintouch.site → the app container (deploy/compose.yaml publishes it
# on 127.0.0.1:3000). Included from the app's server block in
# /etc/nginx/sites-available/stayintouch; installed by deploy/bootstrap.sh.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Pages stream their parts as they are ready (Suspense): don't hold them.
    proxy_buffering off;
}
