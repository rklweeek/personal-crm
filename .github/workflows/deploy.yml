# Push to main → image tagged with the commit SHA → GHCR → on the server:
# migrations → new app → smoke test of /health. The steps live in deploy/.
name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy on the server
        run: bash deploy/remote.sh deploy.sh "$IMAGE" "$GITHUB_ACTOR"
        env:
          # Lets the server pull the image; valid only while this job runs.
          REMOTE_STDIN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test
        run: bash deploy/smoke.sh "${{ vars.APP_URL }}/health" "$GITHUB_SHA"
